name: Build offline APK

on:
  push:
    paths:
      - 'offline/**'
      - '.github/workflows/offline-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0" > /dev/null

      - name: Build debug APK
        working-directory: offline
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DubStudioOffline-apk
          path: offline/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
